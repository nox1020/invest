plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def envVersionCode = System.getenv("ANDROID_VERSION_CODE")
def resolvedVersionCode = flutter.versionCode
if (envVersionCode != null && envVersionCode ==~ /^\d+$/) {
    def parsed = envVersionCode.toInteger()
    if (parsed > resolvedVersionCode) {
        resolvedVersionCode = parsed
    }
}

def hasReleaseKeystore = keystorePropertiesFile.exists() &&
        keystoreProperties["storeFile"] != null &&
        file(keystoreProperties["storeFile"]).exists()

android {
    namespace = "com.nox1020.invest"
    compileSdk = flutter.compileSdkVersion
    // flutter_local_notifications / jni need NDK 28+.
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    defaultConfig {
        applicationId = "com.nox1020.invest"
        minSdk = Math.max(flutter.minSdkVersion, 24)
        targetSdk = flutter.targetSdkVersion
        versionCode = resolvedVersionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    buildTypes {
        release {
            // In-place updates need the SAME signing cert every build.
            // CI always writes android/key.properties + a stable keystore file.
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            } else {
                // Local/dev only. CI must fail before reaching a release APK
                // without key.properties (see workflow).
                signingConfig = signingConfigs.debug
            }
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "invest-${variant.versionName}.apk"
        }
    }
}

flutter {
    source = "../.."
}

// Flutter copies the APK as app-release.apk; rename to invest-<version>.apk.
tasks.configureEach { task ->
    if (task.name != "assembleRelease") return
    task.doLast {
        def dir = file("${rootProject.buildDir}/outputs/flutter-apk")
        def src = new File(dir, "app-release.apk")
        def versionName = android.defaultConfig.versionName
        if (!src.exists() || versionName == null || versionName.toString().trim().isEmpty()) {
            return
        }
        def dest = new File(dir, "invest-${versionName}.apk")
        if (dest.canonicalPath == src.canonicalPath) return
        if (dest.exists()) dest.delete()
        src.renameTo(dest)
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    implementation "androidx.appcompat:appcompat:1.7.0"
}
