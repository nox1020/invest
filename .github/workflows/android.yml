name: Android APK

# CI: analyze, test, release APK
# Also triggered by vinor backend updates (repository_dispatch).
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  repository_dispatch:
    types: [vinor-backend-updated]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      VINOR_API_VERSION: ${{ github.event.client_payload.api_version || '' }}
      VINOR_SHA: ${{ github.event.client_payload.vinor_sha || '' }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Backend trigger info
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "### Vinor backend update" >> "$GITHUB_STEP_SUMMARY"
          echo "- API version: ${VINOR_API_VERSION:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vinor SHA: ${VINOR_SHA:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Message: ${{ github.event.client_payload.commit_message || '' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vplus-android-debug-keystore-v1

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/upload-keystore.jks
            {
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD:-${ANDROID_KEYSTORE_PASSWORD}}"
              echo "keyAlias=${ANDROID_KEY_ALIAS:-upload}"
              echo "storeFile=../upload-keystore.jks"
            } > android/key.properties
            echo "Using upload keystore from secrets."
          else
            mkdir -p ~/.android
            if [ ! -f ~/.android/debug.keystore ]; then
              keytool -genkeypair \
                -keystore ~/.android/debug.keystore \
                -alias androiddebugkey \
                -storepass android \
                -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "Created debug keystore for cache seed."
            else
              echo "Reusing cached debug keystore."
            fi
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK
        id: apk
        run: |
          set -o pipefail
          flutter build apk --release \
            --build-number="${ANDROID_VERSION_CODE}" \
            --build-name="1.0.${ANDROID_VERSION_CODE}" \
            --dart-define=VINOR_API_VERSION="${VINOR_API_VERSION}" \
            2>&1 | tee apk-build.log
          {
            echo "### APK identity"
            echo "- versionCode: ${ANDROID_VERSION_CODE}"
            echo "- versionName: 1.0.${ANDROID_VERSION_CODE}"
            echo "- applicationId: com.nox1020.invest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate APK build errors
        if: failure() && hashFiles('apk-build.log') != ''
        run: |
          {
            echo "===== excerpt ====="
            grep -n -E "What went wrong|Flutter Fix|Error:|FAILURE:|Preferred|requires|Gradle version|AGP|NDK|Exception|Caused by" apk-build.log | tail -n 60 || true
            echo "===== tail ====="
            tail -n 40 apk-build.log
          } > excerpt.txt
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            short=$(printf '%s' "$line" | cut -c1-240)
            echo "::error title=flutter build apk::$short"
          done < excerpt.txt

      - name: Upload APK build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: apk-build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: invest-apk-${{ github.run_number }}${{ env.VINOR_API_VERSION && format('-{0}', env.VINOR_API_VERSION) || '' }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
