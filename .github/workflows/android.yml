name: Android APK

# CI: analyze, test, release APK
# Also triggered by vinor backend updates (repository_dispatch).
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  repository_dispatch:
    types: [vinor-backend-updated]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: write
      checks: write
      pull-requests: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      VINOR_API_VERSION: ${{ github.event.client_payload.api_version || '' }}
      VINOR_SHA: ${{ github.event.client_payload.vinor_sha || '' }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      VPLUS_CI_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      VPLUS_CI_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VPLUS_CI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Backend trigger info
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "### Vinor backend update" >> "$GITHUB_STEP_SUMMARY"
          echo "- API version: ${VINOR_API_VERSION:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vinor SHA: ${VINOR_SHA:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Message: ${{ github.event.client_payload.commit_message || '' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable release keystore
        id: ks-cache
        uses: actions/cache@v4
        with:
          path: android/app/vplus-ci.keystore
          key: vplus-ci-release-keystore-v2

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KS_PATH="android/app/vplus-ci.keystore"
          mkdir -p android/app

          # Defaults for the durable CI sideload key (recovered via cache/artifact).
          STORE_PASS="${VPLUS_CI_STORE_PASS:-vplus-ci-stable-store-2026}"
          KEY_PASS="${VPLUS_CI_KEY_PASS:-$STORE_PASS}"
          KEY_ALIAS="${VPLUS_CI_KEY_ALIAS:-vplus}"

          SIGN_SOURCE="unknown"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${VPLUS_CI_STORE_PASS:-}" ]; then
            STORE_PASS="${VPLUS_CI_STORE_PASS}"
            KEY_PASS="${VPLUS_CI_KEY_PASS:-$STORE_PASS}"
            KEY_ALIAS="${VPLUS_CI_KEY_ALIAS:-upload}"
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${KS_PATH}"
            SIGN_SOURCE="github-secret"
            echo "Using upload keystore from GitHub secrets."
          else
            if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
              echo "::warning::ANDROID_KEYSTORE_BASE64 is set without ANDROID_KEYSTORE_PASSWORD; falling back to durable CI keystore."
            fi
            if [ -f "${KS_PATH}" ]; then
              SIGN_SOURCE="cache"
              echo "Using cached release keystore."
            else
              # Survive cache eviction: recover the exact same keystore from a
              # previous successful workflow artifact.
              ARTIFACT_ID="$(gh api \
                "repos/${{ github.repository }}/actions/artifacts?name=vplus-ci-release-keystore&per_page=20" \
                --jq '.artifacts[] | select(.expired==false) | .id' \
                | head -n 1 || true)"
              if [ -n "${ARTIFACT_ID:-}" ]; then
                gh api \
                  "repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
                  > /tmp/vplus-ks.zip
                unzip -o /tmp/vplus-ks.zip -d /tmp/vplus-ks
                FOUND="$(find /tmp/vplus-ks -type f \( -name '*.keystore' -o -name '*.jks' -o -name '*.p12' \) | head -n 1)"
                if [ -z "${FOUND}" ]; then
                  echo "Artifact ${ARTIFACT_ID} did not contain a keystore file." >&2
                  exit 1
                fi
                cp "${FOUND}" "${KS_PATH}"
                SIGN_SOURCE="artifact-${ARTIFACT_ID}"
                echo "Recovered release keystore from artifact ${ARTIFACT_ID}."
              else
                # First-ever bootstrap only. Later runs must reuse cache/artifact.
                keytool -genkeypair \
                  -storetype PKCS12 \
                  -keystore "${KS_PATH}" \
                  -alias "${KEY_ALIAS}" \
                  -keyalg RSA -keysize 2048 -validity 10000 \
                  -storepass "${STORE_PASS}" \
                  -keypass "${KEY_PASS}" \
                  -dname "CN=V+ Invest CI, OU=nox1020, O=nox1020, C=IR"
                SIGN_SOURCE="bootstrap"
                echo "Bootstrapped a new stable release keystore for sideload updates."
                echo "::warning::New CI signing key created. Devices with older differently-signed installs need one uninstall/reinstall, then updates work."
              fi
            fi
          fi

          if [ ! -f "${KS_PATH}" ]; then
            echo "Release keystore missing after prepare step." >&2
            exit 1
          fi

          {
            echo "storePassword=${STORE_PASS}"
            echo "keyPassword=${KEY_PASS}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "storeFile=vplus-ci.keystore"
          } > android/key.properties

          echo "SIGN_SOURCE=${SIGN_SOURCE}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"

          CERT_SHA="$(keytool -list -v \
            -keystore "${KS_PATH}" \
            -storepass "${STORE_PASS}" \
            | awk '/SHA256:/{print $2; exit}')"
          echo "CERT_SHA256=${CERT_SHA}" >> "$GITHUB_ENV"
          {
            echo "### Signing"
            echo "- source: ${SIGN_SOURCE}"
            echo "- alias: ${KEY_ALIAS}"
            echo "- cert SHA-256: \`${CERT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK
        id: apk
        run: |
          set -o pipefail
          test -f android/key.properties
          test -f android/app/vplus-ci.keystore
          flutter build apk --release \
            --build-number="${ANDROID_VERSION_CODE}" \
            --build-name="1.0.${ANDROID_VERSION_CODE}" \
            --dart-define=VINOR_API_VERSION="${VINOR_API_VERSION}" \
            2>&1 | tee apk-build.log
          {
            echo "### APK identity"
            echo "- versionCode: ${ANDROID_VERSION_CODE}"
            echo "- versionName: 1.0.${ANDROID_VERSION_CODE}"
            echo "- applicationId: com.nox1020.invest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify APK version + signing cert
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "${APK}"

          BT="$(ls -d "${ANDROID_HOME}/build-tools"/* | sort -V | tail -n 1)"
          AAPT="${BT}/aapt"
          APKSIGNER="${BT}/apksigner"

          BADGING="$("${AAPT}" dump badging "${APK}")"
          echo "${BADGING}" | head -n 5
          echo "${BADGING}" | grep -E "package: name='com.nox1020.invest'" >/dev/null

          CODE="$(echo "${BADGING}" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
          NAME="$(echo "${BADGING}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          echo "Parsed versionCode=${CODE} versionName=${NAME}"
          if [ "${CODE}" != "${ANDROID_VERSION_CODE}" ]; then
            echo "versionCode mismatch: apk=${CODE} expected=${ANDROID_VERSION_CODE}" >&2
            exit 1
          fi

          CERTS="$("${APKSIGNER}" verify --print-certs "${APK}" 2>&1 || true)"
          echo "${CERTS}"
          APK_SHA="$(echo "${CERTS}" | tr '[:lower:]' '[:upper:]' | sed -n 's/.*SHA-256 DIGEST: *//p' | head -n1 | tr -d ' :')"
          EXPECT_SHA="$(echo "${CERT_SHA256}" | tr '[:lower:]' '[:upper:]' | tr -d ' :')"
          echo "APK cert SHA-256: ${APK_SHA}"
          echo "Keystore cert SHA-256: ${EXPECT_SHA}"
          if [ -z "${APK_SHA}" ] || [ -z "${EXPECT_SHA}" ] || [ "${APK_SHA}" != "${EXPECT_SHA}" ]; then
            echo "APK signing certificate does not match the prepared keystore." >&2
            exit 1
          fi

          {
            echo "### Verified APK"
            echo "- versionCode: ${CODE}"
            echo "- versionName: ${NAME}"
            echo "- cert SHA-256: \`${CERT_SHA256}\`"
            echo "- sign source: ${SIGN_SOURCE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate APK build errors
        if: failure() && hashFiles('apk-build.log') != ''
        run: |
          {
            echo "===== excerpt ====="
            grep -n -E "What went wrong|Flutter Fix|Error:|FAILURE:|Preferred|requires|Gradle version|AGP|NDK|Exception|Caused by" apk-build.log | tail -n 60 || true
            echo "===== tail ====="
            tail -n 40 apk-build.log
          } > excerpt.txt
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            short=$(printf '%s' "$line" | cut -c1-240)
            echo "::error title=flutter build apk::$short"
          done < excerpt.txt

      - name: Upload APK build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: apk-build.log
          if-no-files-found: ignore

      - name: Persist release keystore for future runs
        if: success() && env.SIGN_SOURCE != 'github-secret'
        uses: actions/upload-artifact@v4
        with:
          name: vplus-ci-release-keystore
          path: android/app/vplus-ci.keystore
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: invest-apk-${{ github.run_number }}${{ env.VINOR_API_VERSION && format('-{0}', env.VINOR_API_VERSION) || '' }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
