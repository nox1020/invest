name: Android APK

# CI: analyze, test, release APK
# Also triggered by vinor backend updates (repository_dispatch).
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  repository_dispatch:
    types: [vinor-backend-updated]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: write
      checks: write
      pull-requests: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      VINOR_API_VERSION: ${{ github.event.client_payload.api_version || '' }}
      VINOR_SHA: ${{ github.event.client_payload.vinor_sha || '' }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Backend trigger info
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "### Vinor backend update" >> "$GITHUB_STEP_SUMMARY"
          echo "- API version: ${VINOR_API_VERSION:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vinor SHA: ${VINOR_SHA:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Message: ${{ github.event.client_payload.commit_message || '' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable release keystore
        id: ks-cache
        uses: actions/cache@v4
        with:
          path: android/app/vplus-ci.keystore
          key: vplus-ci-release-keystore-v4

      - name: Prepare release keystore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          KS_PATH="android/app/vplus-ci.keystore"
          mkdir -p android/app
          STORE_PASS="vplus-ci-stable-store-2026"
          KEY_ALIAS="vplus"
          SIGN_SOURCE="bootstrap"

          # Avoid '+' in DN (LDAP treats it as multi-value separator).
          DNAME="CN=Vplus Invest CI, OU=nox1020, O=nox1020, C=IR"

          if [ -f "${KS_PATH}" ]; then
            if keytool -list -keystore "${KS_PATH}" -storepass "${STORE_PASS}" -alias "${KEY_ALIAS}"; then
              SIGN_SOURCE="cache"
              echo "Using cached release keystore."
            else
              echo "Cached keystore invalid; regenerating."
              rm -f "${KS_PATH}"
            fi
          fi

          if [ ! -f "${KS_PATH}" ]; then
            ARTIFACT_ID=""
            if command -v curl >/dev/null && command -v python3 >/dev/null; then
              ARTIFACT_ID="$(curl -sS \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=vplus-ci-release-keystore&per_page=20" \
                | python3 -c 'import json,sys
try:
 d=json.load(sys.stdin)
 ids=[a["id"] for a in d.get("artifacts",[]) if not a.get("expired")]
 print(ids[0] if ids else "")
except Exception:
 print("")' || true)"
            fi
            if [ -n "${ARTIFACT_ID}" ]; then
              echo "Trying artifact ${ARTIFACT_ID}"
              curl -sS -L \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
                -o /tmp/vplus-ks.zip || true
              if [ -f /tmp/vplus-ks.zip ]; then
                rm -rf /tmp/vplus-ks
                mkdir -p /tmp/vplus-ks
                unzip -o /tmp/vplus-ks.zip -d /tmp/vplus-ks || true
                FOUND="$(find /tmp/vplus-ks -type f \( -name '*.keystore' -o -name '*.jks' -o -name '*.p12' \) | head -n 1 || true)"
                if [ -n "${FOUND}" ]; then
                  cp "${FOUND}" "${KS_PATH}"
                  if keytool -list -keystore "${KS_PATH}" -storepass "${STORE_PASS}" -alias "${KEY_ALIAS}"; then
                    SIGN_SOURCE="artifact-${ARTIFACT_ID}"
                    echo "Recovered keystore from artifact."
                  else
                    rm -f "${KS_PATH}"
                  fi
                fi
              fi
            fi
          fi

          if [ ! -f "${KS_PATH}" ]; then
            keytool -genkeypair \
              -noprompt \
              -storetype PKCS12 \
              -keystore "${KS_PATH}" \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${STORE_PASS}" \
              -keypass "${STORE_PASS}" \
              -dname "${DNAME}"
            SIGN_SOURCE="bootstrap"
            echo "Bootstrapped stable release keystore."
            echo "::warning::New CI signing key created. Uninstall the old app once, then future APKs update in place."
          fi

          keytool -list -keystore "${KS_PATH}" -storepass "${STORE_PASS}" -alias "${KEY_ALIAS}"
          test -f "${KS_PATH}"

          printf '%s\n' \
            "storePassword=${STORE_PASS}" \
            "keyPassword=${STORE_PASS}" \
            "keyAlias=${KEY_ALIAS}" \
            "storeFile=vplus-ci.keystore" \
            > android/key.properties

          CERT_SHA="$(keytool -list -v -keystore "${KS_PATH}" -storepass "${STORE_PASS}" | awk '/SHA256:/{print $2; exit}')"
          test -n "${CERT_SHA}"
          echo "SIGN_SOURCE=${SIGN_SOURCE}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "CERT_SHA256=${CERT_SHA}" >> "$GITHUB_ENV"
          echo "### Signing" >> "$GITHUB_STEP_SUMMARY"
          echo "- source: ${SIGN_SOURCE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- alias: ${KEY_ALIAS}" >> "$GITHUB_STEP_SUMMARY"
          echo "- cert SHA-256: \`${CERT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK
        id: apk
        run: |
          set -o pipefail
          test -f android/key.properties
          test -f android/app/vplus-ci.keystore
          flutter build apk --release \
            --build-number="${ANDROID_VERSION_CODE}" \
            --build-name="1.0.${ANDROID_VERSION_CODE}" \
            --dart-define=VINOR_API_VERSION="${VINOR_API_VERSION}" \
            2>&1 | tee apk-build.log
          {
            echo "### APK identity"
            echo "- versionCode: ${ANDROID_VERSION_CODE}"
            echo "- versionName: 1.0.${ANDROID_VERSION_CODE}"
            echo "- applicationId: com.nox1020.invest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify APK version + signing cert
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "${APK}"

          BT="$(ls -d "${ANDROID_HOME}/build-tools"/* | sort -V | tail -n 1)"
          AAPT="${BT}/aapt"
          APKSIGNER="${BT}/apksigner"

          BADGING="$("${AAPT}" dump badging "${APK}")"
          echo "${BADGING}" | head -n 5
          echo "${BADGING}" | grep -E "package: name='com.nox1020.invest'" >/dev/null

          CODE="$(echo "${BADGING}" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
          NAME="$(echo "${BADGING}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          echo "Parsed versionCode=${CODE} versionName=${NAME}"
          if [ "${CODE}" != "${ANDROID_VERSION_CODE}" ]; then
            echo "versionCode mismatch: apk=${CODE} expected=${ANDROID_VERSION_CODE}" >&2
            exit 1
          fi

          CERTS="$("${APKSIGNER}" verify --print-certs "${APK}" 2>&1 || true)"
          echo "${CERTS}"
          APK_SHA="$(echo "${CERTS}" | tr '[:lower:]' '[:upper:]' | sed -n 's/.*SHA-256 DIGEST: *//p' | head -n1 | tr -d ' :')"
          EXPECT_SHA="$(echo "${CERT_SHA256}" | tr '[:lower:]' '[:upper:]' | tr -d ' :')"
          echo "APK cert SHA-256: ${APK_SHA}"
          echo "Keystore cert SHA-256: ${EXPECT_SHA}"
          if [ -z "${APK_SHA}" ] || [ -z "${EXPECT_SHA}" ] || [ "${APK_SHA}" != "${EXPECT_SHA}" ]; then
            echo "APK signing certificate does not match the prepared keystore." >&2
            exit 1
          fi

          {
            echo "### Verified APK"
            echo "- versionCode: ${CODE}"
            echo "- versionName: ${NAME}"
            echo "- cert SHA-256: \`${CERT_SHA256}\`"
            echo "- sign source: ${SIGN_SOURCE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate APK build errors
        if: failure() && hashFiles('apk-build.log') != ''
        run: |
          {
            echo "===== excerpt ====="
            grep -n -E "What went wrong|Flutter Fix|Error:|FAILURE:|Preferred|requires|Gradle version|AGP|NDK|Exception|Caused by" apk-build.log | tail -n 60 || true
            echo "===== tail ====="
            tail -n 40 apk-build.log
          } > excerpt.txt
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            short=$(printf '%s' "$line" | cut -c1-240)
            echo "::error title=flutter build apk::$short"
          done < excerpt.txt

      - name: Upload APK build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: apk-build.log
          if-no-files-found: ignore

      - name: Persist release keystore for future runs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vplus-ci-release-keystore
          path: android/app/vplus-ci.keystore
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: invest-apk-${{ github.run_number }}${{ env.VINOR_API_VERSION && format('-{0}', env.VINOR_API_VERSION) || '' }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
