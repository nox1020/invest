name: Android APK

# CI: analyze, test, release APK
# Also triggered by vinor backend updates (repository_dispatch).
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  repository_dispatch:
    types: [vinor-backend-updated]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      VINOR_API_VERSION: ${{ github.event.client_payload.api_version || '' }}
      VINOR_SHA: ${{ github.event.client_payload.vinor_sha || '' }}
    steps:
      - name: Backend trigger info
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "### Vinor backend update" >> "$GITHUB_STEP_SUMMARY"
          echo "- API version: ${VINOR_API_VERSION:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vinor SHA: ${VINOR_SHA:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Message: ${{ github.event.client_payload.commit_message || '' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK
        id: apk
        run: |
          set -o pipefail
          flutter build apk --release \
            --dart-define=VINOR_API_VERSION="${VINOR_API_VERSION}" \
            2>&1 | tee apk-build.log

      - name: Annotate APK build errors
        if: failure() && hashFiles('apk-build.log') != ''
        run: |
          {
            echo "===== excerpt ====="
            grep -n -E "What went wrong|Flutter Fix|Error:|FAILURE:|Preferred|requires|Gradle version|AGP|NDK|Exception|Caused by" apk-build.log | tail -n 60 || true
            echo "===== tail ====="
            tail -n 40 apk-build.log
          } > excerpt.txt
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            short=$(printf '%s' "$line" | cut -c1-240)
            echo "::error title=flutter build apk::$short"
          done < excerpt.txt

      - name: Upload APK build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: apk-build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: invest-apk${{ env.VINOR_API_VERSION && format('-{0}', env.VINOR_API_VERSION) || '' }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
